name: TG Stream Android release

on:
  push:
    tags: ["v*"]
    branches: ["tg-stream-rebrand"]
    paths: [".github/tg-stream-build-request"]
  workflow_dispatch:

concurrency:
  group: tg-stream-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: version
        run: |
          python3 scripts/release-version.py --check
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then TAG="$(cat .github/tg-stream-build-request)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 scripts/release-version.py "$TAG" --github-output

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Set the release signing secrets first"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          MSONE_GATEWAY_KEY: ${{ secrets.MSONE_GATEWAY_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          test -n "$TG_API_ID" && test -n "$TG_API_HASH" || { echo "::error::Set TG_API_ID and TG_API_HASH first"; exit 1; }
          if [ -n "$TMDB_API_KEY" ]; then echo "TMDB artwork key: configured"; else echo "TMDB artwork key: missing; exact IMDb poster fallback enabled"; fi
          printf 'TG_API_ID=%s\nTG_API_HASH=%s\nMSONE_GATEWAY_KEY=%s\nOPENSUBTITLES_API_KEY=%s\nTMDB_API_KEY=%s\nOMDB_API_KEY=%s\n' "$TG_API_ID" "$TG_API_HASH" "$MSONE_GATEWAY_KEY" "$OPENSUBTITLES_API_KEY" "$TMDB_API_KEY" "$OMDB_API_KEY" > local.properties

      - name: Install native build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm meson ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Restore FFmpeg extension cache
        uses: actions/cache@v4
        with:
          path: |
            build/media3ext/*.aar
            build/media3ext/stamp
          key: media3ext-${{ hashFiles('scripts/build-media3ext.sh', 'scripts/media3ext/*.patch', 'gradle/libs.versions.toml') }}

      - name: Build FFmpeg extension
        run: JOBS=4 scripts/build-media3ext.sh

      - name: Build signed universal APK
        run: |
          ./gradlew :app:assembleRelease -PtmRequireMedia3ext=true \
            -PtmVersionName="${{ steps.version.outputs.name }}" \
            -PtmVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/TG-Stream-${VERSION}-universal.apk"
          NOTES="$(git tag -l --format='%(contents:body)' "${{ steps.version.outputs.tag }}")"
          if [ -z "$NOTES" ] && [ -f "docs/releases/$VERSION.md" ]; then NOTES="$(cat "docs/releases/$VERSION.md")"; fi
          if [ -z "$NOTES" ]; then NOTES="TG Stream ${VERSION}"; fi
          printf '%s\n' "$NOTES" > release-notes.md
          if [ "${{ steps.version.outputs.prerelease }}" != "true" ]; then
            python3 scripts/write-latest-json.py --version "$VERSION" --dist dist \
              --notes "$NOTES" --repo "$GITHUB_REPOSITORY" --asset-prefix TG-Stream \
              --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
              --android-only --out dist/latest.json
          fi

      - name: Verify APK identity and update manifest
        run: |
          APK="dist/TG-Stream-${{ steps.version.outputs.name }}-universal.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-verification.txt
          grep -Fxq "Number of signers: 1" apk-verification.txt
          grep -Fq "certificate SHA-256 digest: 3580acc62809ab114ccb00d567d24fe3b2aee2cc4f1aa02e2d5242ae27119686" apk-verification.txt
          "$(dirname "$APKSIGNER")/aapt2" dump badging "$APK" > apk-badging.txt
          grep -Ei "^(package:|[^:]*sdk[^:]*:|native-code:)" apk-badging.txt
          python3 - "$APK" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" <<'PY'
          import hashlib, json, pathlib, re, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          version, code = sys.argv[2:]
          badging = pathlib.Path("apk-badging.txt").read_text()
          assert "package: name='com.rinsanak.tgstream'" in badging, "Unexpected application ID"
          assert f"versionName='{version}'" in badging and f"versionCode='{code}'" in badging, "Unexpected APK version"
          minimum = re.search(r"(?im)^(?:min)?sdkVersion:\s*['\"]?(\d+)", badging)
          target = re.search(r"(?im)^targetSdkVersion:\s*['\"]?(\d+)", badging)
          assert minimum and minimum.group(1) == "23" and target and target.group(1) == "35", "Unexpected SDK range:\n" + badging
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split("/")[1] for name in archive.namelist() if name.startswith("lib/") and name.endswith(".so")}
          assert {"arm64-v8a", "armeabi-v7a"} <= abis, abis
          feed_path = pathlib.Path("dist/latest.json")
          if feed_path.exists():
              feed = json.loads(feed_path.read_text())
              asset = feed["assets"]["android-universal"]
              digest = hashlib.sha256()
              with apk.open("rb") as stream:
                  for block in iter(lambda: stream.read(1048576), b""):
                      digest.update(block)
              assert feed["version"] == version and str(feed["versionCode"]) == code
              assert asset["size"] == apk.stat().st_size and asset["sha256"] == digest.hexdigest()
              assert asset["url"].endswith("/v" + version + "/" + apk.name)
              print("Verified APK SHA-256:", digest.hexdigest())
          print("Verified package, version, SDK range, ARM ABIs and update manifest")
          PY

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties local.properties

      - name: Require successful Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          android_ci_status() {
            local sha="$1" run
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.id) | last | .id // empty' || true)"
            if [ -n "$run" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest" --jq '.jobs[] | select(.name == "Test and build") | .conclusion // .status' || true
            fi
          }
          # A release-script-only fix keeps app code, tests, build inputs and CI commands identical.
          # Reuse its tested parent only after proving that these are the only changed paths.
          PARENT_SHA="$(git rev-parse HEAD^)"
          PARENT_EQUIVALENT=false
          CHANGED="$(git diff --name-only "$PARENT_SHA" HEAD)"
          if [ -n "$CHANGED" ]; then
            if ! printf '%s\n' "$CHANGED" | grep -Eqv '^(\.github/workflows/release\.yml|\.github/tg-stream-build-request)$'; then
              PARENT_EQUIVALENT=true
            fi
          fi
          for attempt in $(seq 1 120); do
            STATUS="$(android_ci_status "$GITHUB_SHA")"
            if [ "$STATUS" = success ]; then exit 0; fi
            if [ "$PARENT_EQUIVALENT" = true ]; then
              PARENT_STATUS="$(android_ci_status "$PARENT_SHA")"
              if [ "$PARENT_STATUS" = success ]; then
                echo "Reusing successful Android CI for byte-identical app and test source: $PARENT_SHA"
                exit 0
              fi
            fi
            case "$STATUS" in
              failure|cancelled|timed_out) echo "::error::Android CI did not pass ($STATUS). No release published."; exit 1 ;;
            esac
            echo "Waiting for Android CI: $STATUS"
            sleep 15
          done
          echo "::error::Android CI was not successful within the wait window. Re-run after it completes."
          exit 1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
            if [ "$CURRENT" != "$GITHUB_SHA" ]; then echo "::error::A newer source commit exists. Publish its build instead."; exit 1; fi
          fi
          ARGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" dist/* --target "$GITHUB_SHA" --title "TG Stream ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md "${ARGS[@]}"
